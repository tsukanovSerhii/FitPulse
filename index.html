<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Primary Meta Tags (SEO) -->
    <title>FitPulse — Трекер тренувань, анатомія м'язів та техніка вправ</title>
    <meta name="title" content="FitPulse — Трекер тренувань, анатомія м'язів та техніка вправ" />
    <meta name="description" content="FitPulse — Професійний фітнес-трекер: інтерактивна біомеханіка та анатомія м'язів, покрокова техніка виконання вправ, планувальник сплітів та живий таймер відпочинку." />
    <meta name="keywords" content="тренування, фітнес, вправи в залі, техніка виконання вправ, анатомія м'язів, жим лежачи, присідання, станова тяга, програма тренувань, як правильно тренуватися, бодібілдинг" />
    <meta name="author" content="FitPulse / Serhii Tsukanov" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0e0e10" />
    <script>
      // Apply the theme before first paint to avoid a flash
      try {
        var mode = JSON.parse(localStorage.getItem('fitpulse_theme_v1') || '"system"');
        var dark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0e0e10' : '#f4f4f2');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fitpulse.app/" />
    <meta property="og:title" content="FitPulse — Сучасний трекер тренувань та анатомія м'язів" />
    <meta property="og:description" content="Дізнайтеся, як правильно робити кожну вправу: інтерактивна анатомія м'язів, фази руху, поради новачкам та секрети досвідчених атлетів." />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:site_name" content="FitPulse" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="FitPulse — Трекер тренувань та техніка вправ" />
    <meta property="twitter:description" content="Інтерактивна база вправ з біомеханікою, планами тренувань та анатомією для новачків і профі." />
