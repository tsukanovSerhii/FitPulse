name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Validate deployment config
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
      - run: npm run lint
      - run: npm test
      - name: Type check and production build
        run: npm run build
      - name: Bundle size budget
        run: npm run check:size
      - uses: actions/upload-artifact@v4
        with:
          name: fitpulse-dist
          path: frontend/dist
          retention-days: 7

  e2e:
    name: End-to-end tests
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      - uses: actions/download-artifact@v4
        with:
          name: fitpulse-dist
          path: frontend/dist
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.16 autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: frontend/lighthouse-report
          retention-days: 14
