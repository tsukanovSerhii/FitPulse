# Local development: docker compose up
#   app        http://localhost:5173
#   admin      http://localhost:5174
#   API        http://localhost:3000/api/health
#   admin API  http://localhost:3001/api/health
#   mail       http://localhost:8025 (Mailpit catches every email)
# Secrets below are for local use only.

x-node: &node
  build:
    context: .
    dockerfile: Dockerfile.dev
  image: fitpulse-dev
  # Source from the host; dependencies from the image, so Windows and Linux modules never mix
  volumes:
    - ./:/app
    - node_modules:/app/node_modules
    - backend_modules:/app/backend/node_modules
    - admin_api_modules:/app/backend-AdminPanel/node_modules
    - web_modules:/app/frontend/node_modules
    - admin_web_modules:/app/frontend-AdminPanel/node_modules
    - db_modules:/app/packages/db/node_modules
    - core_modules:/app/packages/server-core/node_modules
  environment: &node-env
    NODE_ENV: development
    DATABASE_URL: postgresql://fitpulse:fitpulse@db:5432/fitpulse
    REDIS_URL: redis://redis:6379
    # File watching over bind mounts from Windows and macOS
    CHOKIDAR_USEPOLLING: 'true'

x-backend-deps: &backend-deps
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  mailpit:
    image: axllent/mailpit
    ports:
      - '8025:8025'
      - '1025:1025'

  migrate:
    condition: service_completed_successfully

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fitpulse
      POSTGRES_PASSWORD: fitpulse
      POSTGRES_DB: fitpulse
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fitpulse -d fitpulse']
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *node
    # Builds the shared packages once for every service, then applies migrations
    command: sh -c "npm run build -w @fitpulse/contracts -w @fitpulse/server-core -w @fitpulse/db && npm run migrate:deploy -w @fitpulse/db"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *node
    command: npm run dev --ignore-scripts -w @fitpulse/api
    environment:
      <<: *node-env
      PORT: '3000'
      JWT_SECRET: dev-only-jwt-secret-change-me-0000000000
      APP_URL: http://localhost:5173
      MAIL_PROVIDER: smtp
      SMTP_URL: smtp://mailpit:1025
      RATE_LIMIT_ENABLED: 'false'
    ports:
      - '3000:3000'
    depends_on:
      <<: *backend-deps
      mailpit:
        condition: service_started

  admin-api:
    <<: *node
    command: npm run dev --ignore-scripts -w @fitpulse/admin-api
    environment:
      <<: *node-env
      PORT: '3001'
      ADMIN_JWT_SECRET: dev-only-admin-jwt-secret-change-me-0000000000
      RATE_LIMIT_ENABLED: 'false'
    ports:
      - '3001:3001'
    depends_on: *backend-deps

  web:
    <<: *node
    command: npm run dev --ignore-scripts -w @fitpulse/web
    environment:
      <<: *node-env
      API_PROXY_TARGET: http://api:3000
    ports:
      - '5173:5173'
    depends_on:
      - api

  admin-web:
    <<: *node
    command: npm run dev --ignore-scripts -w @fitpulse/admin-web
    environment:
      <<: *node-env
      API_PROXY_TARGET: http://admin-api:3001
    ports:
      - '5174:5174'
    depends_on:
      - admin-api

volumes:
  pgdata:
  node_modules:
  backend_modules:
  admin_api_modules:
  web_modules:
  admin_web_modules:
  db_modules:
  core_modules:
