# Local development: Postgres, the API and the Vite dev server.
#   docker compose up            -> app on http://localhost:5173, API on http://localhost:8000/api/docs
#   docker compose exec api pytest
name: fitpulse

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fitpulse
      POSTGRES_PASSWORD: fitpulse
      POSTGRES_DB: fitpulse
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitpulse -d fitpulse"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: postgresql://fitpulse:fitpulse@db:5432/fitpulse
      TEST_DATABASE_URL: postgresql://fitpulse:fitpulse@db:5432/fitpulse_test
    volumes:
      - ./backend:/app
      # keep a host virtualenv out of the container
      - /app/.venv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8000
      # file events do not cross a Windows or macOS bind mount
      VITE_WATCH_POLLING: "true"
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db-data:
  web-node-modules:
